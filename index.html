<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="theme-color" content="#185FA5">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.svg">
<title>My Workout Tracker</title>
<style>
:root {
  --blue: #185FA5;
  --blue-light: #e6f1fb;
  --blue-dark: #0C447C;
  --green: #1D9E75;
  --green-light: #e1f5ee;
  --green-dark: #085041;
  --teal: #0F6E56;
  --teal-light: #E1F5EE;
  --amber: #BA7517;
  --amber-light: #FAEEDA;
  --bg: #f2f2f0;
  --card: #ffffff;
  --border: #e8e8e8;
  --text: #1a1a1a;
  --text2: #666;
  --text3: #aaa;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; display: flex; flex-direction: column; }

.topbar { background: var(--blue); color: white; padding: calc(var(--safe-top) + 12px) 16px 12px; flex-shrink: 0; }
.topbar-title { font-size: 17px; font-weight: 700; }
.topbar-sub { font-size: 11px; opacity: 0.75; margin-top: 1px; }

.bottom-nav { background: var(--card); border-top: 1px solid var(--border); display: flex; padding-bottom: var(--safe-bot); flex-shrink: 0; }
.bnav-btn { flex: 1; padding: 10px 0 8px; background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text3); font-size: 10px; font-weight: 500; }
.bnav-btn.active { color: var(--blue); }
.bnav-icon { width: 22px; height: 22px; }

.scroll-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 14px 20px; }

.install-banner { background: var(--blue); color: white; padding: 12px 16px; font-size: 13px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 10px; }
.install-banner b { font-weight: 700; display: block; margin-bottom: 2px; }
.install-close { background: rgba(255,255,255,0.25); border: none; color: white; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }

/* DAY TABS */
.day-tabs { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-bottom: 14px; }
.day-tab { padding: 9px 4px; font-size: 11px; font-weight: 600; border: 1.5px solid var(--border); border-radius: 10px; cursor: pointer; background: var(--card); color: var(--text2); text-align: center; line-height: 1.4; }
.day-tab.active { background: var(--blue); color: white; border-color: var(--blue); }
.day-tab-sub { font-size: 9px; font-weight: 400; opacity: 0.8; display: block; }

.stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 12px; }
.stat-box { background: var(--card); border-radius: 10px; padding: 10px 8px; text-align: center; border: 1px solid var(--border); }
.stat-val { font-size: 20px; font-weight: 700; color: var(--text); }
.stat-lbl { font-size: 10px; color: var(--text3); margin-top: 1px; }

.prog-wrap { background: var(--border); border-radius: 99px; height: 5px; margin-bottom: 14px; }
.prog-fill { height: 5px; border-radius: 99px; background: var(--blue); transition: width .3s; }

.tip-box { background: var(--blue-light); border-radius: 10px; padding: 9px 12px; font-size: 12px; color: var(--blue-dark); margin-bottom: 12px; line-height: 1.5; }
.tip-box b { font-weight: 700; }
.prev-banner { background: var(--green-light); border-radius: 8px; padding: 7px 12px; font-size: 11px; color: var(--green-dark); margin-bottom: 12px; }

.ex-block { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
.ex-head { padding: 10px 13px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
.ex-name { font-size: 13px; font-weight: 700; flex: 1; line-height: 1.3; }
.ex-scheme { font-size: 10px; color: var(--text3); white-space: nowrap; margin-left: 8px; }
.set-cols { display: grid; grid-template-columns: 40px 1fr 1fr 70px 32px; gap: 5px; padding: 3px 12px 1px; }
.set-cols span { font-size: 10px; color: var(--text3); text-align: center; }
.set-cols span:first-child { text-align: left; }
.set-row { display: grid; grid-template-columns: 40px 1fr 1fr 70px 32px; gap: 5px; align-items: center; padding: 7px 12px; border-bottom: 1px solid #f7f7f7; }
.set-row:last-child { border-bottom: none; }
.set-lbl { font-size: 11px; color: var(--text3); font-weight: 600; }
.set-inp { width: 100%; padding: 7px 4px; font-size: 14px; border: 1.5px solid #e5e5e5; border-radius: 8px; background: #fafafa; text-align: center; color: var(--text); -webkit-appearance: none; }
.set-inp:focus { outline: none; border-color: var(--blue); background: #fff; }
.prev-cell { text-align: center; }
.prev-w { font-size: 11px; color: var(--green); font-weight: 600; display: block; }
.prev-r { font-size: 10px; color: var(--text3); display: block; }
.prev-n { font-size: 11px; color: #ddd; }
.chk { width: 30px; height: 30px; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: #fff; flex-shrink: 0; }
.chk.done { background: var(--blue); border-color: var(--blue); }
.chk-icon { display: none; width: 6px; height: 10px; border-right: 2.5px solid #fff; border-bottom: 2.5px solid #fff; transform: rotate(45deg) translateY(-1px); }
.chk.done .chk-icon { display: block; }

/* CARDIO */
.cardio-wrap { display: flex; flex-direction: column; gap: 12px; }

.cardio-summary { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 4px; }
.csumm-box { background: var(--card); border-radius: 10px; padding: 10px 8px; text-align: center; border: 1px solid var(--border); }
.csumm-val { font-size: 20px; font-weight: 700; color: var(--text); }
.csumm-lbl { font-size: 10px; color: var(--text3); margin-top: 1px; }
.csumm-sub { font-size: 10px; color: var(--text3); margin-top: 1px; }

.weekly-bar-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 4px; }
.wbc-title { font-size: 13px; font-weight: 700; margin-bottom: 12px; color: var(--text); }
.week-bars { display: flex; gap: 6px; align-items: flex-end; height: 80px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.bar-fill-wrap { width: 100%; background: var(--bg); border-radius: 4px; display: flex; align-items: flex-end; flex: 1; overflow: hidden; }
.bar-fill-inner { width: 100%; background: var(--blue); border-radius: 4px; transition: height .4s; min-height: 0; }
.bar-fill-inner.today { background: var(--green); }
.bar-day { font-size: 10px; color: var(--text3); font-weight: 600; }
.bar-min { font-size: 9px; color: var(--text3); }

.goal-track { background: var(--teal-light); border-radius: 10px; padding: 10px 14px; margin-bottom: 4px; }
.goal-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.goal-label { font-size: 13px; font-weight: 700; color: var(--teal); }
.goal-nums { font-size: 12px; color: var(--teal); }
.goal-bar-wrap { background: rgba(15,110,86,0.15); border-radius: 99px; height: 7px; }
.goal-bar-fill { height: 7px; border-radius: 99px; background: var(--teal); transition: width .4s; }

.cardio-log-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.cardio-log-head { padding: 11px 14px; border-bottom: 1px solid #f0f0f0; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; }
.cardio-form { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.form-row { display: flex; flex-direction: column; gap: 5px; }
.form-label { font-size: 12px; color: var(--text2); font-weight: 600; }
.form-input { width: 100%; padding: 10px 12px; font-size: 15px; border: 1.5px solid #e5e5e5; border-radius: 10px; background: #fafafa; color: var(--text); -webkit-appearance: none; }
.form-input:focus { outline: none; border-color: var(--blue); background: #fff; }
select.form-input { cursor: pointer; }
.intensity-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.intensity-btn { padding: 9px 4px; font-size: 12px; font-weight: 600; border: 1.5px solid var(--border); border-radius: 10px; cursor: pointer; background: var(--card); color: var(--text2); text-align: center; }
.intensity-btn.active-low { background: var(--green-light); color: var(--green-dark); border-color: var(--green); }
.intensity-btn.active-mod { background: var(--amber-light); color: var(--amber); border-color: var(--amber); }
.intensity-btn.active-high { background: #FAECE7; color: #712B13; border-color: #D85A30; }
.notes-input { width: 100%; padding: 10px 12px; font-size: 14px; border: 1.5px solid #e5e5e5; border-radius: 10px; background: #fafafa; color: var(--text); resize: none; font-family: inherit; }
.notes-input:focus { outline: none; border-color: var(--blue); background: #fff; }

.btn-save { width: 100%; padding: 15px; font-size: 16px; font-weight: 700; border: none; border-radius: 12px; background: var(--blue); color: white; cursor: pointer; margin-top: 4px; }
.btn-save:active { opacity: 0.85; }
.btn-reset { width: 100%; padding: 11px; font-size: 13px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); cursor: pointer; color: var(--text3); margin-top: 8px; }

/* HISTORY */
.filter-scroll { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; -webkit-overflow-scrolling: touch; }
.filter-scroll::-webkit-scrollbar { display: none; }
.filt-btn { padding: 6px 14px; font-size: 12px; font-weight: 600; border: 1.5px solid var(--border); border-radius: 99px; background: var(--card); color: var(--text2); white-space: nowrap; cursor: pointer; flex-shrink: 0; }
.filt-btn.active { background: var(--blue); color: white; border-color: var(--blue); }

.sess-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
.sess-head { padding: 10px 13px; background: #f9f9f7; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.sess-date { font-size: 13px; font-weight: 700; }
.sess-day-lbl { font-size: 11px; color: var(--text3); margin-top: 1px; }
.sess-del { font-size: 22px; color: #ccc; background: none; border: none; cursor: pointer; padding: 0 4px; line-height: 1; }
.sess-del:active { color: #e24b4a; }
.hist-ex { padding: 8px 13px; border-bottom: 1px solid #f7f7f7; }
.hist-ex:last-child { border-bottom: none; }
.hist-ex-name { font-size: 12px; font-weight: 700; color: #444; margin-bottom: 5px; }
.pills { display: flex; flex-wrap: wrap; gap: 5px; }
.pill { font-size: 11px; background: #f0f0f0; border-radius: 6px; padding: 3px 9px; color: #555; }
.pill.done { background: var(--green-light); color: var(--green-dark); }
.pill.cardio-pill { background: var(--teal-light); color: var(--teal); }

.cardio-hist-row { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 13px; }
.c-detail { font-size: 12px; color: var(--text2); }
.c-detail b { font-weight: 700; color: var(--text); }

.empty { text-align: center; color: var(--text3); padding: 60px 20px; font-size: 14px; line-height: 2; }

input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
input[type=number] { -moz-appearance: textfield; }
</style>
</head>
<body>

<div class="install-banner" id="install-banner" style="display:none;">
  <div><b>Add to Home Screen</b>Tap Share → "Add to Home Screen" for offline app</div>
  <button class="install-close" onclick="document.getElementById('install-banner').style.display='none'">Got it</button>
</div>

<div class="topbar">
  <div class="topbar-title" id="topbar-title">Workout Tracker</div>
  <div class="topbar-sub" id="topbar-sub">4-day split</div>
</div>

<div class="scroll-area" id="scroll-area">

  <!-- LOG VIEW -->
  <div id="view-log">
    <div class="day-tabs" id="day-tabs"></div>
    <div class="stats-row" id="stats"></div>
    <div class="prog-wrap"><div class="prog-fill" id="prog" style="width:0%"></div></div>
    <div id="day-content"></div>
    <button class="btn-save" onclick="saveSession()">Save session</button>
    <button class="btn-reset" onclick="resetDay()">Clear inputs</button>
    <div style="height:8px;"></div>
  </div>

  <!-- CARDIO VIEW -->
  <div id="view-cardio" style="display:none;">
    <div class="cardio-wrap">

      <div class="cardio-summary" id="cardio-summary"></div>

      <div class="goal-track" id="goal-track"></div>

      <div class="weekly-bar-card">
        <div class="wbc-title">This week (Mon–Sun)</div>
        <div class="week-bars" id="week-bars"></div>
      </div>

      <div class="cardio-log-card">
        <div class="cardio-log-head">
          <span>Log cardio session</span>
        </div>
        <div class="cardio-form">
          <div class="form-row">
            <label class="form-label">Date</label>
            <input class="form-input" type="date" id="c-date">
          </div>
          <div class="form-row">
            <label class="form-label">Type</label>
            <select class="form-input" id="c-type" onchange="handleTypeChange(this.value)"></select>
          </div>
          <div class="form-row" id="custom-type-row" style="display:none;">
            <label class="form-label">Custom type name</label>
            <div style="display:flex;gap:8px;">
              <input class="form-input" type="text" id="c-custom-type" placeholder="e.g. Stair climber" style="flex:1;">
              <button onclick="addCustomType()" style="padding:10px 14px;font-size:13px;font-weight:600;border:1.5px solid var(--blue);border-radius:10px;background:var(--blue-light);color:var(--blue-dark);cursor:pointer;white-space:nowrap;">Add</button>
            </div>
          </div>
          <div class="form-row">
            <label class="form-label">Duration (minutes)</label>
            <input class="form-input" type="number" inputmode="numeric" id="c-duration" placeholder="e.g. 35" min="1" max="300">
          </div>
          <div class="form-row">
            <label class="form-label">Intensity</label>
            <div class="intensity-row">
              <button class="intensity-btn" id="int-low" onclick="setIntensity('low')">Low<br><span style="font-size:9px;font-weight:400;">Zone 2</span></button>
              <button class="intensity-btn" id="int-mod" onclick="setIntensity('moderate')">Moderate<br><span style="font-size:9px;font-weight:400;">Steady</span></button>
              <button class="intensity-btn" id="int-high" onclick="setIntensity('high')">High<br><span style="font-size:9px;font-weight:400;">HIIT</span></button>
            </div>
          </div>
          <div class="form-row">
            <label class="form-label">Notes (optional)</label>
            <textarea class="notes-input" id="c-notes" rows="2" placeholder="e.g. felt good, incline 5%..."></textarea>
          </div>
          <button class="btn-save" onclick="saveCardio()">Save cardio</button>
        </div>
      </div>

      <div style="height:8px;"></div>
    </div>
  </div>

  <!-- HISTORY VIEW -->
  <div id="view-history" style="display:none;">
    <div class="filter-scroll" id="hist-filters"></div>
    <div id="hist-content"></div>
  </div>

</div>

<div class="bottom-nav">
  <button class="bnav-btn active" id="bnav-log" onclick="showView('log')">
    <svg class="bnav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
    Weights
  </button>
  <button class="bnav-btn" id="bnav-cardio" onclick="showView('cardio')">
    <svg class="bnav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    Cardio
  </button>
  <button class="bnav-btn" id="bnav-history" onclick="showView('history')">
    <svg class="bnav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    History
  </button>
</div>

<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
const isMobile = /iPhone|iPad|Android/i.test(navigator.userAgent);
if (isMobile && !isStandalone) document.getElementById('install-banner').style.display = 'flex';

const PROG = [
  { day:"Day 1", title:"Upper 1 — Pull", focus:"Back & biceps", note:"Retract shoulder blades before every pull. Control the lowering phase for 2 sec.", exercises:[
    {name:"Lat pull down", scheme:"8–10 × 4", sets:4},
    {name:"Cable seated row (V grip)", scheme:"8–10 × 4", sets:4},
    {name:"DB/BB bent over row", scheme:"8–10 × 4", sets:4},
    {name:"One arm DB row", scheme:"8–10 × 4 each side", sets:4},
    {name:"Face pull", scheme:"12 × 4", sets:4},
  ]},
  { day:"Day 2", title:"Lower 1 — Quads", focus:"Quads, abductors, calves", note:"Keep knees tracking over toes on leg press. Squeeze glutes at the top.", exercises:[
    {name:"Leg press", scheme:"8–10 × 3", sets:3},
    {name:"Leg extension", scheme:"10–12 × 3", sets:3},
    {name:"Hip adduction", scheme:"10–12 × 3", sets:3},
    {name:"Hip abduction (machine)", scheme:"10–12 × 3", sets:3},
    {name:"Calf raise", scheme:"10–12 × 3", sets:3},
    {name:"Hip abduction (cable/band)", scheme:"12 × 4", sets:4},
  ]},
  { day:"Day 3", title:"Upper 2 — Push", focus:"Chest, shoulders, triceps", note:"DB, BB or machine — your choice. Machine is great for mind-muscle connection.", exercises:[
    {name:"DB/BB/Machine chest press", scheme:"8–10 × 3", sets:3},
    {name:"DB/BB/Machine shoulder press", scheme:"8–10 × 3", sets:3},
    {name:"Machine fly", scheme:"8–10 × 3", sets:3},
    {name:"DB side lateral raise", scheme:"10–12 × 3", sets:3},
    {name:"Tricep rope pushdown", scheme:"10–12 × 3", sets:3},
  ]},
  { day:"Day 4", title:"Lower 2 — Posterior", focus:"Hamstrings, glutes, core", note:"Keep lower back neutral on RDL — hinge at hips. Reverse crunch: max reps in 30 sec.", exercises:[
    {name:"DB Sumo squat", scheme:"8–10 × 3", sets:3},
    {name:"RDL", scheme:"10–12 × 3", sets:3},
    {name:"Leg curl", scheme:"10–12 × 3", sets:3},
    {name:"45° hip extension", scheme:"10–12 × 3", sets:3},
    {name:"Reverse crunch", scheme:"30 sec × 3 max reps", sets:3},
  ]}
];

const WEEKLY_GOAL = 150;
const SK_W = 'wt_hist_v3';
const SK_C = 'cardio_hist_v1';
const SK_TYPES = 'cardio_types_v1';
const DEFAULT_TYPES = ['Treadmill', 'Walk', 'Run'];
function loadHist() { try { return JSON.parse(localStorage.getItem(SK_W)) || []; } catch(e) { return []; } }
function saveHist(h) { localStorage.setItem(SK_W, JSON.stringify(h)); }
function loadCardio() { try { return JSON.parse(localStorage.getItem(SK_C)) || []; } catch(e) { return []; } }
function saveCardio2(h) { localStorage.setItem(SK_C, JSON.stringify(h)); }
function loadTypes() { try { return JSON.parse(localStorage.getItem(SK_TYPES)) || DEFAULT_TYPES; } catch(e) { return DEFAULT_TYPES; } }
function saveTypes(t) { localStorage.setItem(SK_TYPES, JSON.stringify(t)); }

function populateTypeSelect() {
  const types = loadTypes();
  const sel = document.getElementById('c-type');
  const current = sel.value;
  sel.innerHTML = types.map(t => `<option value="${t}">${t}</option>`).join('') +
    `<option value="__custom__">+ Add new type...</option>`;
  if (current && types.includes(current)) sel.value = current;
}

function handleTypeChange(val) {
  document.getElementById('custom-type-row').style.display = val === '__custom__' ? 'block' : 'none';
}

function addCustomType() {
  const input = document.getElementById('c-custom-type');
  const name = input.value.trim();
  if (!name) { alert('Please enter a name.'); return; }
  const types = loadTypes();
  if (types.includes(name)) { alert('That type already exists.'); return; }
  types.push(name);
  saveTypes(types);
  input.value = '';
  populateTypeSelect();
  document.getElementById('c-type').value = name;
  document.getElementById('custom-type-row').style.display = 'none';
}

const state = {};
PROG.forEach((d,di) => {
  state[di] = {};
  d.exercises.forEach((ex,ei) => {
    state[di][ei] = {};
    for (let s=0; s<ex.sets; s++) state[di][ei][s] = {weight:'', reps:'', done:false};
  });
});

let activeDay=0, histFilter='weekly', currentView='log', selectedIntensity='moderate';

// Set default date to today
function todayStr() {
  const d = new Date();
  return d.toISOString().split('T')[0];
}

function getLastSession(di) {
  const h = loadHist();
  for (let i=h.length-1; i>=0; i--) { if (h[i].dayIndex===di) return h[i]; }
  return null;
}
function totalSets(di) { let t=0; PROG[di].exercises.forEach(ex=>t+=ex.sets); return t; }
function doneSets(di) { let t=0; Object.values(state[di]).forEach(ex=>Object.values(ex).forEach(s=>{ if(s.done) t++; })); return t; }

function renderTabs() {
  document.getElementById('day-tabs').innerHTML = PROG.map((d,i) =>
    `<button class="day-tab${i===activeDay?' active':''}" onclick="selectDay(${i})">${d.day}<span class="day-tab-sub">${d.focus.split(',')[0]}</span></button>`
  ).join('');
}

function renderStats() {
  const total=totalSets(activeDay), done=doneSets(activeDay), pct=total?Math.round((done/total)*100):0;
  document.getElementById('prog').style.width = pct+'%';
  document.getElementById('stats').innerHTML = `
    <div class="stat-box"><div class="stat-val">${PROG[activeDay].exercises.length}</div><div class="stat-lbl">exercises</div></div>
    <div class="stat-box"><div class="stat-val">${total}</div><div class="stat-lbl">total sets</div></div>
    <div class="stat-box"><div class="stat-val">${done}/${total}</div><div class="stat-lbl">done</div></div>`;
}

function renderDay() {
  const d = PROG[activeDay];
  const last = getLastSession(activeDay);
  document.getElementById('topbar-title').textContent = d.title;
  document.getElementById('topbar-sub').textContent = d.focus;
  let html = `<div class="tip-box"><b>Tip:</b> ${d.note}</div>`;
  if (last) html += `<div class="prev-banner">Last session: ${fmtDate(last.date)} — green = previous weights</div>`;
  d.exercises.forEach((ex,ei) => {
    html += `<div class="ex-block"><div class="ex-head"><span class="ex-name">${ex.name}</span><span class="ex-scheme">${ex.scheme}</span></div>
      <div class="set-cols"><span>Set</span><span>kg</span><span>Reps</span><span>Last time</span><span></span></div>`;
    for (let s=0; s<ex.sets; s++) {
      const st = state[activeDay][ei][s];
      let prev = `<span class="prev-n">—</span>`;
      if (last && last.exercises && last.exercises[ei] && last.exercises[ei][s]) {
        const p = last.exercises[ei][s];
        if (p.weight || p.reps) prev = `<span class="prev-w">${p.weight||'?'}kg</span><span class="prev-r">${p.reps||'?'} reps</span>`;
      }
      html += `<div class="set-row">
        <span class="set-lbl">S${s+1}</span>
        <input class="set-inp" type="number" inputmode="decimal" placeholder="kg" value="${st.weight}" oninput="sv(${activeDay},${ei},${s},'weight',this.value)" step="0.5" min="0">
        <input class="set-inp" type="number" inputmode="numeric" placeholder="reps" value="${st.reps}" oninput="sv(${activeDay},${ei},${s},'reps',this.value)" step="1" min="0">
        <div class="prev-cell">${prev}</div>
        <div class="chk${st.done?' done':''}" onclick="td(${activeDay},${ei},${s})"><div class="chk-icon"></div></div>
      </div>`;
    }
    html += `</div>`;
  });
  document.getElementById('day-content').innerHTML = html;
  document.getElementById('scroll-area').scrollTop = 0;
}

function selectDay(i) { activeDay=i; renderTabs(); renderStats(); renderDay(); }
function sv(di,ei,si,f,v) { state[di][ei][si][f]=v; }
function td(di,ei,si) { state[di][ei][si].done=!state[di][ei][si].done; renderStats(); renderDay(); }

function resetDay() {
  if (!confirm('Clear all inputs for this day?')) return;
  PROG[activeDay].exercises.forEach((ex,ei) => {
    for (let s=0; s<ex.sets; s++) state[activeDay][ei][s] = {weight:'',reps:'',done:false};
  });
  renderStats(); renderDay();
}

function saveSession() {
  let hasData = false;
  const exData = {};
  PROG[activeDay].exercises.forEach((ex,ei) => {
    exData[ei] = {};
    for (let s=0; s<ex.sets; s++) {
      const st = state[activeDay][ei][s];
      exData[ei][s] = {weight:st.weight, reps:st.reps, done:st.done};
      if (st.weight || st.reps) hasData = true;
    }
  });
  if (!hasData) { alert('Log some weights or reps first!'); return; }
  const h = loadHist();
  h.push({ id:Date.now(), date:new Date().toISOString(), dayIndex:activeDay, dayTitle:PROG[activeDay].title, type:'weights', exercises:exData });
  saveHist(h);
  alert('Session saved!');
}

// CARDIO
function setIntensity(level) {
  selectedIntensity = level;
  ['low','mod','high'].forEach(l => {
    const btn = document.getElementById('int-'+l);
    btn.className = 'intensity-btn';
    if ((l==='low'&&level==='low')||(l==='mod'&&level==='moderate')||(l==='high'&&level==='high')) {
      btn.className = `intensity-btn active-${l==='mod'?'mod':l==='low'?'low':'high'}`;
    }
  });
}

function getWeekRange() {
  const now = new Date();
  const day = now.getDay(); // 0=Sun
  const mon = new Date(now); mon.setDate(now.getDate() - (day===0?6:day-1)); mon.setHours(0,0,0,0);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6); sun.setHours(23,59,59,999);
  return {mon, sun};
}

function getWeekSessions() {
  const {mon, sun} = getWeekRange();
  return loadCardio().filter(s => {
    const d = new Date(s.date);
    return d >= mon && d <= sun;
  });
}

function renderCardioView() {
  document.getElementById('topbar-title').textContent = 'Cardio Tracker';
  document.getElementById('topbar-sub').textContent = 'Treadmill sessions';
  document.getElementById('c-date').value = todayStr();
  populateTypeSelect();
  setIntensity(selectedIntensity);

  const allCardio = loadCardio();
  const weekSessions = getWeekSessions();
  const weekMins = weekSessions.reduce((a,s) => a+parseInt(s.duration||0), 0);
  const totalSessions = allCardio.length;
  const totalMins = allCardio.reduce((a,s) => a+parseInt(s.duration||0), 0);
  const avgMins = totalSessions ? Math.round(totalMins/totalSessions) : 0;

  // Summary cards
  document.getElementById('cardio-summary').innerHTML = `
    <div class="csumm-box"><div class="csumm-val">${weekMins}</div><div class="csumm-lbl">min this week</div></div>
    <div class="csumm-box"><div class="csumm-val">${weekSessions.length}</div><div class="csumm-lbl">sessions</div></div>
    <div class="csumm-box"><div class="csumm-val">${avgMins||'—'}</div><div class="csumm-lbl">avg min/session</div></div>`;

  // Goal tracker
  const goalPct = Math.min(100, Math.round((weekMins/WEEKLY_GOAL)*100));
  const remaining = Math.max(0, WEEKLY_GOAL - weekMins);
  document.getElementById('goal-track').innerHTML = `
    <div class="goal-row">
      <span class="goal-label">Weekly goal: 150–180 min</span>
      <span class="goal-nums">${weekMins} / ${WEEKLY_GOAL} min</span>
    </div>
    <div class="goal-bar-wrap"><div class="goal-bar-fill" style="width:${goalPct}%"></div></div>
    <div style="font-size:11px;color:var(--teal);margin-top:6px;">${goalPct>=100 ? 'Goal reached this week!' : `${remaining} min to go`}</div>`;

  // Weekly bar chart (Mon–Sun)
  const {mon} = getWeekRange();
  const dayNames = ['M','T','W','T','F','S','S'];
  const dayMins = [0,0,0,0,0,0,0];
  weekSessions.forEach(s => {
    const d = new Date(s.date);
    const idx = Math.min(6, Math.max(0, Math.round((d-mon)/(1000*60*60*24))));
    dayMins[idx] += parseInt(s.duration||0);
  });
  const maxMins = Math.max(60, ...dayMins);
  const todayIdx = (() => { const d=new Date().getDay(); return d===0?6:d-1; })();
  const barsHtml = dayMins.map((m,i) => {
    const h = m ? Math.max(6, Math.round((m/maxMins)*64)) : 0;
    return `<div class="bar-col">
      <div class="bar-fill-wrap"><div class="bar-fill-inner${i===todayIdx?' today':''}" style="height:${h}px"></div></div>
      <div class="bar-day">${dayNames[i]}</div>
      <div class="bar-min">${m||''}</div>
    </div>`;
  }).join('');
  document.getElementById('week-bars').innerHTML = barsHtml;
}

function saveCardio() {
  const date = document.getElementById('c-date').value;
  const type = document.getElementById('c-type').value;
  const duration = document.getElementById('c-duration').value;
  const notes = document.getElementById('c-notes').value.trim();
  if (!duration || parseInt(duration) < 1) { alert('Please enter a duration in minutes.'); return; }
  const h = loadCardio();
  h.push({ id:Date.now(), date: date || todayStr(), type, duration:parseInt(duration), intensity:selectedIntensity, notes, sessionType:'cardio' });
  saveCardio2(h);
  document.getElementById('c-duration').value = '';
  document.getElementById('c-notes').value = '';
  document.getElementById('c-date').value = todayStr();
  renderCardioView();
  alert('Cardio session saved!');
}

// HISTORY
function showView(v) {
  currentView = v;
  ['log','cardio','history'].forEach(name => {
    document.getElementById('view-'+name).style.display = name===v ? 'block' : 'none';
    const btn = document.getElementById('bnav-'+name);
    if (btn) btn.classList.toggle('active', name===v);
  });
  if (v==='log') { document.getElementById('topbar-title').textContent = PROG[activeDay].title; document.getElementById('topbar-sub').textContent = PROG[activeDay].focus; }
  else if (v==='cardio') renderCardioView();
  else if (v==='history') { document.getElementById('topbar-title').textContent = 'History'; document.getElementById('topbar-sub').textContent = 'All sessions'; renderHistory(); }
  document.getElementById('scroll-area').scrollTop = 0;
}

function setHistFilter(f) { histFilter=f; renderHistory(); }

function getWeekKey(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return null;
  const day = d.getDay();
  const mon = new Date(d);
  mon.setDate(d.getDate() - (day===0?6:day-1));
  mon.setHours(0,0,0,0);
  return mon.toISOString().split('T')[0];
}

function fmtWeekRange(monStr) {
  const mon = new Date(monStr);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  const opts = {month:'short', day:'numeric'};
  return `${mon.toLocaleDateString('en-US',opts)} – ${sun.toLocaleDateString('en-US',opts)}`;
}

function buildWeeklySummaries() {
  const weights = loadHist();
  const cardio = loadCardio();
  const weekMap = {};

  weights.forEach(s => {
    const k = getWeekKey(s.date);
    if (!k) return;
    if (!weekMap[k]) weekMap[k] = {cardioMins:0, weightDays:new Set(), cardioSessions:[], weightSessions:[]};
    weekMap[k].weightDays.add(s.dayIndex);
    weekMap[k].weightSessions.push(s);
  });

  cardio.forEach(s => {
    const k = getWeekKey(s.date);
    if (!k) return;
    if (!weekMap[k]) weekMap[k] = {cardioMins:0, weightDays:new Set(), cardioSessions:[], weightSessions:[]};
    weekMap[k].cardioMins += parseInt(s.duration||0);
    weekMap[k].cardioSessions.push(s);
  });

  return Object.entries(weekMap).sort((a,b) => b[0].localeCompare(a[0]));
}

function renderHistory() {
  let fhtml = `
    <button class="filt-btn${histFilter==='weekly'?' active':''}" onclick="setHistFilter('weekly')">Weekly</button>
    <button class="filt-btn${histFilter===-1?' active':''}" onclick="setHistFilter(-1)">All sessions</button>
    <button class="filt-btn${histFilter==='cardio'?' active':''}" onclick="setHistFilter('cardio')">Cardio</button>`;
  PROG.forEach((d,i) => { fhtml += `<button class="filt-btn${histFilter===i?' active':''}" onclick="setHistFilter(${i})">${d.day}</button>`; });
  document.getElementById('hist-filters').innerHTML = fhtml;

  if (histFilter === 'weekly') { renderWeeklySummaries(); return; }

  const weights = loadHist().map(s => ({...s, _type:'weights'}));
  const cardio = loadCardio().map(s => ({...s, _type:'cardio'}));
  let all = [...weights, ...cardio].sort((a,b) => new Date(b.date)-new Date(a.date));

  if (histFilter === 'cardio') all = all.filter(s => s._type==='cardio');
  else if (typeof histFilter === 'number' && histFilter >= 0) all = all.filter(s => s._type==='weights' && s.dayIndex===histFilter);

  if (!all.length) {
    document.getElementById('hist-content').innerHTML = `<div class="empty">No sessions yet.<br>Log a workout or cardio session<br>and save it to see history.</div>`;
    return;
  }

  let html = '';
  all.forEach(sess => {
    if (sess._type === 'cardio') {
      const intColor = sess.intensity==='low'?'color:#1D9E75':sess.intensity==='high'?'color:#D85A30':'color:#BA7517';
      html += `<div class="sess-card">
        <div class="sess-head">
          <div><div class="sess-date">${fmtDate(sess.date)}</div><div class="sess-day-lbl">Cardio</div></div>
          <button class="sess-del" onclick="delCardio(${sess.id})">&#215;</button>
        </div>
        <div class="cardio-hist-row">
          <span class="pill cardio-pill">${sess.type}</span>
          <span class="pill cardio-pill">${sess.duration} min</span>
          <span class="pill" style="${intColor};background:#f9f9f7;">${sess.intensity}</span>
          ${sess.notes?`<span style="font-size:11px;color:var(--text3);width:100%;margin-top:2px;">${sess.notes}</span>`:''}
        </div>
      </div>`;
    } else {
      const d = PROG[sess.dayIndex];
      if (!d) return;
      html += `<div class="sess-card"><div class="sess-head">
        <div><div class="sess-date">${fmtDate(sess.date)}</div><div class="sess-day-lbl">${sess.dayTitle||d.title}</div></div>
        <button class="sess-del" onclick="delWeight(${sess.id})">&#215;</button>
      </div>`;
      d.exercises.forEach((ex,ei) => {
        const sets = sess.exercises[ei] || {};
        let pills = '';
        for (let s=0; s<ex.sets; s++) {
          const p = sets[s] || {};
          if (p.weight || p.reps) pills += `<span class="pill${p.done?' done':''}">${p.weight||'—'}kg × ${p.reps||'—'}</span>`;
        }
        if (pills) html += `<div class="hist-ex"><div class="hist-ex-name">${ex.name}</div><div class="pills">${pills}</div></div>`;
      });
      html += `</div>`;
    }
  });
  document.getElementById('hist-content').innerHTML = html;
}

function renderWeeklySummaries() {
  const weeks = buildWeeklySummaries();
  if (!weeks.length) {
    document.getElementById('hist-content').innerHTML = `<div class="empty">No sessions yet.<br>Save a workout or cardio session<br>to see your weekly summary.</div>`;
    return;
  }

  let html = '';
  weeks.forEach(([monStr, w]) => {
    const cardioMins = w.cardioMins;
    const weightCount = w.weightDays.size;
    const cardioGoalPct = Math.min(100, Math.round((cardioMins/WEEKLY_GOAL)*100));
    const cardioRemaining = Math.max(0, WEEKLY_GOAL - cardioMins);

    let badge, badgeStyle;
    if (cardioMins >= WEEKLY_GOAL && weightCount >= 4) {
      badge='Great week'; badgeStyle='background:#EAF3DE;color:#27500A;';
    } else if (cardioMins >= WEEKLY_GOAL*0.7 && weightCount >= 3) {
      badge='Almost there'; badgeStyle='background:#FAEEDA;color:#633806;';
    } else {
      badge='Needs work'; badgeStyle='background:#FCEBEB;color:#791F1F;';
    }

    const dayPills = PROG.map((d,i) => {
      const done = w.weightDays.has(i);
      return `<span style="font-size:11px;padding:4px 10px;border-radius:99px;font-weight:500;${done?'background:#E6F1FB;color:#0C447C;':'background:#f5f5f3;color:#aaa;border:0.5px solid #e8e8e8;'}">${d.day}</span>`;
    }).join('');

    const barPct = cardioGoalPct;
    const barColor = cardioMins >= WEEKLY_GOAL ? '#1D9E75' : cardioMins >= WEEKLY_GOAL*0.7 ? '#BA7517' : '#E24B4A';
    const cardioNote = cardioMins >= WEEKLY_GOAL
      ? `<span style="font-size:11px;color:#27500A;font-weight:500;">Goal met!</span>`
      : `<span style="font-size:11px;color:#791F1F;">${cardioRemaining} min short</span>`;

    html += `<div class="sess-card">
      <div class="sess-head">
        <div>
          <div class="sess-date">${fmtWeekRange(monStr)}</div>
          <div class="sess-day-lbl">${weightCount} weight session${weightCount!==1?'s':''} · ${cardioMins} min cardio</div>
        </div>
        <span style="font-size:11px;font-weight:500;padding:3px 9px;border-radius:99px;${badgeStyle}">${badge}</span>
      </div>

      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px 14px 10px;">
        <div style="background:#f5f5f3;border-radius:8px;padding:9px 10px;">
          <div style="font-size:19px;font-weight:700;color:#1a1a1a;">${cardioMins}</div>
          <div style="font-size:10px;color:#aaa;margin-top:2px;">cardio min</div>
        </div>
        <div style="background:#f5f5f3;border-radius:8px;padding:9px 10px;">
          <div style="font-size:19px;font-weight:700;color:#1a1a1a;">${weightCount}/4</div>
          <div style="font-size:10px;color:#aaa;margin-top:2px;">weight sessions</div>
        </div>
      </div>

      <div style="padding:0 14px 10px;">
        <div style="font-size:10px;font-weight:500;color:#aaa;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:7px;">Cardio goal — 150 min</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="flex:1;background:#ebebeb;border-radius:99px;height:7px;">
            <div style="height:7px;border-radius:99px;background:${barColor};width:${barPct}%;transition:width .4s;"></div>
          </div>
          ${cardioNote}
        </div>
      </div>

      <div style="height:0.5px;background:#f0f0f0;margin:0 14px;"></div>

      <div style="padding:10px 14px 12px;">
        <div style="font-size:10px;font-weight:500;color:#aaa;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:7px;">Weight training days</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">${dayPills}</div>
      </div>
    </div>`;
  });

  document.getElementById('hist-content').innerHTML = html;
}

function delCardio(id) {
  if (!confirm('Delete this session?')) return;
  saveCardio2(loadCardio().filter(s=>s.id!==id));
  renderHistory();
}
function delWeight(id) {
  if (!confirm('Delete this session?')) return;
  saveHist(loadHist().filter(s=>s.id!==id));
  renderHistory();
}

function fmtDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric'});
}

renderTabs(); renderStats(); renderDay();
</script>
</body>
</html>
